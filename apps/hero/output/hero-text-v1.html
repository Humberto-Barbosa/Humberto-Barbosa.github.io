<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Generated Hero Block v1</title>
    <meta
      name="description"
      content="A hero block created with my Hero Block Generator, using Tailwind CSS with background and custom text."
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      .hero {
        @apply flex items-center px-6 py-16 md:px-16 md:py-24;
      }
      .hero-content {
        @apply w-full max-w-3xl;
      }
      .hero h1 {
        @apply text-4xl font-bold leading-tight break-words md:text-6xl;
      }
      .hero h2 {
        @apply mt-4 max-w-2xl text-lg leading-snug break-words md:text-2xl;
      }
      .hero h2[hidden] {
        display: none;
      }
      .hero-light {
        @apply bg-slate-50;
      }
      .hero-light h1 {
        @apply text-slate-900;
      }
      .hero-light h2 {
        @apply text-slate-700;
      }
      .hero-dark {
        @apply bg-slate-900;
      }
      .hero-dark h1 {
        @apply text-slate-50;
      }
      .hero-dark h2 {
        @apply text-slate-300;
      }
      .hero-centre {
        @apply justify-center text-center;
      }
      .hero-centre h2 {
        @apply mx-auto;
      }
      .hero-min-height {
        @apply min-h-[480px] md:min-h-[85vh];
      }
    </style>
  </head>
  <body>
    <header class="hero hero-dark hero-centre">
      <div class="hero-content">
        <h1>Design your next adventure</h1>
        <h2>Lerning Design.</h2>
      </div>
    </header>
  </body>
</html>
