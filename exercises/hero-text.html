<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Block with Text</title>
    <meta
      name="description"
      content="An above-the-fold hero block with animated text and various background colours."
    />
    <!-- Link to Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom styles -->
    <style type="text/tailwindcss">

       header {
        @apply min-h-[60vh] md:min-h-[80vh]
    bg-linear-to-b from-purple-600 to-purple-900 
    flex flex-col justify-center
    px-8 lg:px-60 py-12
    text-center;
      }

      header h1 {
        @apply text-7xl md:text-8xl
        text-white font-bold
        tracking-tight
        mb-6;
      }
      header h2 {
        @apply text-4xl md:text-5xl
            text-white;
      }

      .slide-in-top {
        animation: slide-in-top 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
      }
    </style>
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="assets/img/favicons/apple-touch-icon.png"
        /
        > <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/img/favicons/favicon-32x32.png"
        /
        > <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="assets/img/favicons/favicon-16x16.png"
        /
        > <link
        rel="manifest"
        href="assets/img/favicons/site.webmanifest"
        /
        >
        <!--Jose Humberto Barbosa 71693-->
  </head>

  <body>
    <!-- hero block -->
    <header>
      <h1>Albert Camus</h1>

      <h2>Creative Web Developer</h2>
    </header>
    <!-- /hero block -->

    <p><a href="../index.html">Back to Home page</a></p>
  </body>
</html>
